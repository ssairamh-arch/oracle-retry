name: Create clip-render + clip-small in Hyderabad (retry until Oracle has capacity)

# One robot for the Hyderabad account (2026-11-21). Two robots on the same account doubled the requests and Oracle
# answered "429 Too Many Requests" for hours. This one takes turns between the two servers, sends ONE launch
# request per try (zone and image are looked up once per round), and backs off 15 -> 30 -> 60 min on a 429.
# retry_hyd_small.yml is switched off; this robot makes clip-small too.

on:
  schedule:
    - cron: "11 */2 * * *"   # backup trigger, every 2 h (a round restarts itself anyway)
  workflow_dispatch: {}

concurrency: retry-hyd

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write   # lets the job switch itself off, or restart itself
    env:
      OCI_CLI_USER: ${{ secrets.OCI_HYD_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_HYD_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_HYD_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_HYD_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_HYD_PRIVATE_KEY }}
      COMPARTMENT: ${{ secrets.OCI_HYD_COMPARTMENT_OCID }}
      SUBNET: ${{ secrets.OCI_HYD_SUBNET_OCID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OCI CLI
        run: pip install --quiet oci-cli
      - name: Retry for about 5 hours
        id: loop
        run: |
          set -u
          end=$(( $(date +%s) + 5*3600 + 1800 ))
          exists() {
            n=$(oci compute instance list --compartment-id "$COMPARTMENT" --display-name "$1" \
              --query 'data[?"lifecycle-state"!=`TERMINATED`] | length(@)' --raw-output 2>/dev/null)
            [ -n "${n:-}" ] && [ "$n" != "0" ]
          }
          # looked up once per round, not on every try
          AD=""; IMAGE=""
          set +e   # GitHub runs bash with -e; a failed lookup must not end the round
          while [ -z "$AD" ] || [ -z "$IMAGE" ]; do
            AD=$(oci iam availability-domain list --compartment-id "$COMPARTMENT" --query 'data[0].name' --raw-output 2>/dev/null)
            IMAGE=$(oci compute image list --compartment-id "$COMPARTMENT" --operating-system "Canonical Ubuntu" \
              --operating-system-version "24.04" --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC \
              --query 'data[0].id' --raw-output 2>/dev/null)
            if [ -z "$AD" ] || [ -z "$IMAGE" ]; then echo "$(date -u +%H:%M) Could not read zone/image yet - waiting 15 min."; sleep 900; fi
            [ "$(date +%s)" -ge "$end" ] && exit 0
          done
          set -e
          need_render=1; need_small=1
          exists clip-render && need_render=0
          exists clip-small && need_small=0
          turn=0; backoff=900
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ $need_render = 0 ] && [ $need_small = 0 ]; then
              echo "clip-render and clip-small both exist - switching this robot off."
              gh workflow disable retry_hyd.yml -R "$GITHUB_REPOSITORY"
              echo "done=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # take turns: big server on even tries, small on odd tries (skip one that already exists)
            if { [ $((turn % 2)) = 0 ] && [ $need_render = 1 ]; } || [ $need_small = 0 ]; then
              name=clip-render; shape='{"ocpus":2,"memoryInGBs":12}'
            else
              name=clip-small; shape='{"ocpus":1,"memoryInGBs":6}'
            fi
            turn=$((turn + 1))
            set +e
            out=$(oci compute instance launch --compartment-id "$COMPARTMENT" --availability-domain "$AD" \
              --display-name "$name" --shape VM.Standard.A1.Flex \
              --shape-config "$shape" --image-id "$IMAGE" --subnet-id "$SUBNET" \
              --assign-public-ip true --ssh-authorized-keys-file ssh_public_key.pub 2>&1)
            rc=$?
            set -e
            wait_s=300
            if [ $rc -eq 0 ]; then
              echo "$(date -u +%H:%M) Launched $name."
              [ $name = clip-render ] && need_render=0 || need_small=0
              backoff=900
            elif echo "$out" | grep -qE "429|TooManyRequests"; then
              echo "$(date -u +%H:%M) $name: Oracle rate limit (429) - waiting $((backoff / 60)) min."
              wait_s=$backoff
              backoff=$(( backoff * 2 > 3600 ? 3600 : backoff * 2 ))
            elif echo "$out" | grep -qi "capacity"; then
              echo "$(date -u +%H:%M) $name: out of capacity - trying again in 5 min."
              backoff=900
            else
              echo "$(date -u +%H:%M) $name: unexpected error:"
              echo "$out" | grep -E '"(status|code|message)"' | head -5
              wait_s=600
            fi
            sleep "$wait_s"
          done
      - name: Start the next round
        if: ${{ steps.loop.outputs.done != '1' && !cancelled() }}
        run: gh workflow run retry_hyd.yml -R "$GITHUB_REPOSITORY"
