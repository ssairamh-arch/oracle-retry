name: Create clip-render (retry until Oracle has capacity)

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}

concurrency: retry

jobs:
  launch:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # lets the job switch itself off once the server exists
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
      SUBNET: ${{ secrets.OCI_SUBNET_OCID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OCI CLI
        run: pip install --quiet oci-cli
      - name: Launch if missing
        run: |
          set -u
          existing=$(oci compute instance list --compartment-id "$COMPARTMENT" --display-name clip-render \
            --query 'data[?"lifecycle-state"!=`TERMINATED`] | length(@)' --raw-output)
          if [ "${existing:-0}" != "0" ]; then
            echo "clip-render already exists - disabling this workflow."
            gh workflow disable retry.yml -R "$GITHUB_REPOSITORY"
            exit 0
          fi
          AD=$(oci iam availability-domain list --compartment-id "$COMPARTMENT" --query 'data[0].name' --raw-output)
          IMAGE=$(oci compute image list --compartment-id "$COMPARTMENT" --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0].id' --raw-output)
          set +e
          out=$(oci compute instance launch --compartment-id "$COMPARTMENT" --availability-domain "$AD" \
            --display-name clip-render --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' --image-id "$IMAGE" --subnet-id "$SUBNET" \
            --assign-public-ip true --ssh-authorized-keys-file ssh_public_key.pub 2>&1)
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "Launched clip-render."
            gh workflow disable retry.yml -R "$GITHUB_REPOSITORY"
          elif echo "$out" | grep -qi "capacity"; then
            echo "Out of capacity - will try again in 10 minutes."
          else
            echo "$out" | grep -v -i "key" ; exit 1
          fi
